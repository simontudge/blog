
<!doctype html>
<html lang="en">
  <head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">


    <title>Simon's Blogging Page</title>

    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

    <!-- Custom styles for this template -->
    <link href="style.css" rel="stylesheet">

  </head>

  <body>

    <main role="main">

      <section class="jumbotron text-center">
        <div class="container">
          <h1 class="jumbotron-heading">Simon's Blog</h1>
          <p class="lead text-muted">I write mostly about travel and film.
          </p>
        </div>
      </section>

      <div class="album py-5 bg-light">
        <div class="container">

          <div class="row">
            
            <div class="col-md-6">
              <a class="link" href="travel-blog/">
                <div class="card mb-4 box-shadow dark-on-hover">
                <div class="card-header">
                  <h4 class="my-0 font-weight-normal">Travel</h4>
                </div>
                <img class="card-img-top" src="travel-blog/thumbnails/uzbekistan.jpg" alt="Card image cap">
                <div class="card-body">
                  <p class="card-text">Blog about my travels</p>
                </div>
                </div>
              </a>
            </div>
            
            <div class="col-md-6">
              <a class="link" href="film/">
                <div class="card mb-4 box-shadow dark-on-hover">
                <div class="card-header">
                  <h4 class="my-0 font-weight-normal">Film</h4>
                </div>
                <img class="card-img-top" src="film/thumbnails/monos.jpeg" alt="Card image cap">
                <div class="card-body">
                  <p class="card-text">Film Reviews</p>
                </div>
                </div>
              </a>
            </div>

            <div class="col-md-6">
              <a class="link" href="short-stories/">
                <div class="card mb-4 box-shadow dark-on-hover">
                <div class="card-header">
                  <h4 class="my-0 font-weight-normal">Short Stories</h4>
                </div>
                <img class="card-img-top" src="short-stories/thumbnails/cave.jpeg" alt="Card image cap">
                <div class="card-body">
                  <p class="card-text">A Collection of Short Stories</p>
                </div>
                </div>
              </a>
            </div>


          </div>
        </div>
      </div>

    </main>

  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Colours and serif stack match site.css, so the tab icon reads as part
       of the same site. Light mode: ink square, cream letter. -->
  <rect width="100" height="100" rx="18" fill="#23211e"/>
  <text x="50" y="50" fill="#fffefb"
        font-family="Charter, 'Iowan Old Style', Georgia, 'Times New Roman', serif"
        font-size="68" font-weight="600"
        text-anchor="middle" dominant-baseline="central">S</text>
</svg>
